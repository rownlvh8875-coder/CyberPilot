[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "cyberlateral-dev"
version = "0.3.0"
description = "Offline synthetic lateral development calculation API; not vehicle runtime"
requires-python = "==3.12.13"
dependencies = []

[dependency-groups]
dev = [
  "numpy==2.5.3",
  "ruff==0.16.7",
  "ty==0.0.80",
  "codespell==2.4.3",
  "PyYAML==6.0.3",
]

[tool.uv]
package = false
python-preference = "only-managed"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 160
indent-width = 4
lint.select = ["E4", "E7", "E9", "F", "I", "B", "UP", "PIE", "RUF100", "ISC004"]

[tool.ruff.format]
quote-style = "preserve"

[tool.codespell]
quiet-level = 3
