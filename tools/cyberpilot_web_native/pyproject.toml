[project]
name = "cyberpilot-web-native-verification"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pycapnp==2.1.0", "numpy==2.5.3", "zstandard==0.25.0", "Cython==3.3.0", "scons==4.11.1", "setuptools==84.0.0"]

[dependency-groups]
dev = ["ruff==0.16.7", "ty==0.0.80", "codespell==2.4.3", "playwright==1.62.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 160
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["../.."]
