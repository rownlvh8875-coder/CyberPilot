name: CyberPilot Native Bounded Integration CI

'on':
  push:
    branches: [feature/cyber-autotune]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  native-bounded:
    name: OFFLINE_NATIVE_BOUNDED_SYNTHETIC_CI
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout public source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: false
          submodules: false
          persist-credentials: false
      - name: Exact qualified Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.13'
          architecture: x64
          check-latest: false
      - name: Pinned public numerical wheels
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r tools/cyberpilot/numerical-offline-requirements.txt
      - name: Separate verified Native artifact build
        run: |
          test "$(gcc-13 -dumpfullversion)" = '13.3.0'
          timeout 60s python -B tools/cyberpilot/run_canonical_runtime_feasibility.py --build "$RUNNER_TEMP/native-bounded-build" > "$RUNNER_TEMP/native-bounded-build.json"
          cat "$RUNNER_TEMP/native-bounded-build.json"
      - name: Preserve existing Native qualification
        run: |
          RECEIPT="$RUNNER_TEMP/native-bounded-build/build.json"
          DIGEST=$(sha256sum "$RECEIPT" | cut -d' ' -f1)
          timeout 2400s python -B tools/cyberpilot/run_canonical_runtime_feasibility.py --receipt "$RECEIPT" --receipt-sha256 "$DIGEST" --tests
      - name: Native bounded numerical authority and lifetime tests
        run: |
          RECEIPT="$RUNNER_TEMP/native-bounded-build/build.json"
          DIGEST=$(sha256sum "$RECEIPT" | cut -d' ' -f1)
          timeout 2400s python -B tools/cyberpilot/run_canonical_native_bounded.py --receipt "$RECEIPT" --receipt-sha256 "$DIGEST" --tests
      - name: Fixed A B C benchmarks fresh repeats and source-free verification
        run: |
          RECEIPT="$RUNNER_TEMP/native-bounded-build/build.json"
          DIGEST=$(sha256sum "$RECEIPT" | cut -d' ' -f1)
          python -B tools/cyberpilot/run_canonical_native_bounded.py --receipt "$RECEIPT" --receipt-sha256 "$DIGEST" --head "$GITHUB_SHA" --benchmark --output-root "$RUNNER_TEMP/native-bounded-measurements"
      - name: Scoped Ruff syntax source integrity and publication
        run: |
          python -m ruff check openpilot/tools/cyber_autotune/empirical_hurdle_v4_e2_canonical_native_bounded.py openpilot/tools/cyber_autotune/empirical_hurdle_v4_e2_canonical_caller_profile.py openpilot/tools/cyber_autotune/tests/test_empirical_hurdle_v4_e2_canonical_native_bounded.py openpilot/tools/cyber_autotune/tests/test_empirical_hurdle_v4_e2_canonical_caller_profile.py tools/cyberpilot/run_canonical_native_bounded.py
          python -m compileall -q openpilot/tools/cyber_autotune/empirical_hurdle_v4_e2_canonical_native_bounded.py openpilot/tools/cyber_autotune/empirical_hurdle_v4_e2_canonical_caller_profile.py openpilot/tools/cyber_autotune/tests/test_empirical_hurdle_v4_e2_canonical_native_bounded.py openpilot/tools/cyber_autotune/tests/test_empirical_hurdle_v4_e2_canonical_caller_profile.py tools/cyberpilot/run_canonical_native_bounded.py
          python -B tools/cyberpilot/check_publication.py --base 7cf1630773918dd560153517f45bfc75663c6f97
          git diff --check 7cf1630773918dd560153517f45bfc75663c6f97 HEAD
          test -z "$(git status --porcelain)"
          echo 'OFFLINE_NATIVE_BOUNDED_SYNTHETIC_CI; FULL_CI and private execution remain separate'
