: evaluate(request: object)->dict, canonical_summary(request: object)->bytes, ReferenceError fixed codes.\n- f70_synthetic_exact_audit.py: independent evaluate/canonical_summary and AuditError; integer pair arithmetic; no Primary/Fraction helpers.\n- test_f70_synthetic_exact_reference.py: real outputs and security behavior; immutable public vectors.\n- run_f70_synthetic_exact_reference.py: source/fixture pins, exact-ID collection, actual run ledger, guarded IO, canonical validation output.\n- Machine contract, fixture registry and hand-derived golden vectors are frozen support evidence.\n\n## Tasks\n\n- [ ] Task 1 RED: write expected-ID tests first; missing implementations must cause assertion FAIL with zero ERROR. Preserve red result.\n- [ ] Task 2 GREEN: implement strict Primary and independent Audit. Validate exact golden outputs, rejections, immutable input and interval proofs.\n- [ ] Task 3 GREEN: implement guarded runner and its tests. Reject missing/duplicate/unexpected IDs, skip/faked pass, altered source/case pins and forbidden access.\n- [ ] Task 4: freeze source hashes and run two independent isolated copies with identical source/contract. Compare exact IDs, public-case results and canonical bytes.\n- [ ] Task 5: run bounded existing 28+55 guarded regression, explicit-file Ruff/Ty/Codespell/compile, privacy/static isolation, frozen preservation.\n- [ ] Task 6: one fresh final code review, address important findings by TDD, then seal Korean report, manifests and deterministic ZIP.\n\n## Rulings\n\n- User scope and safety restrictions override skill defaults to commit frequently, use a project worktree, or run an unrestricted repository-wide test discovery.\n- The approved existing 83 guarded tests plus the complete new isolated suite are the regression scope; a general suite could invoke forbidden Controller/data paths.\n- No legacy F61 execution equivalence is claimed for non-dyadic inputs. New exact consumer is separate and old F61 remains unchanged.\n- 