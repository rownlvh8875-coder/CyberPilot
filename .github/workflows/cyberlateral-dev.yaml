name: CyberLateral Offline Development

on:
  push:
    branches: [main, feature/cyberlateral-dev-offline-ci]
    paths: ['tools/cyberlateral_dev/**', '.github/workflows/cyberlateral-dev.yaml', 'README.md']
  pull_request:
    branches: [main]
    paths: ['tools/cyberlateral_dev/**', '.github/workflows/cyberlateral-dev.yaml', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyberlateral-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7, peeled commit
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Verify standalone package, tests and report
        run: uv run --project tools/cyberlateral_dev --locked python -B tools/cyberlateral_dev/dev.py verify --output tools/cyberlateral_dev/out/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cyberlateral-offline-verification
          path: tools/cyberlateral_dev/out/ci
          if-no-files-found: error
          retention-days: 14
