name: CyberLateral Cloud Tooling

on:
  push:
    branches: [main]
    paths: ['tools/cyberlateral_cloud/**', 'tools/cyberlateral_dev/**', '.github/workflows/cyberlateral-cloud.yaml', '.github/workflows/cyberlateral-dev.yaml', 'README.md']
  pull_request:
    branches: [main]
    paths: ['tools/cyberlateral_cloud/**', 'tools/cyberlateral_dev/**', '.github/workflows/cyberlateral-cloud.yaml', '.github/workflows/cyberlateral-dev.yaml', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyberlateral-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: cloud tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
      UV_LINK_MODE: copy
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/cyberlateral-cloud-app
      CLOUD_HF_ENV: ${{ runner.temp }}/cyberlateral-cloud-sdk
      CLOUD_VERIFY_OUTPUT: ${{ runner.temp }}/cyberlateral-cloud-verification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7, peeled commit
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install locked isolated app and SDK environments
        id: dependencies
        timeout-minutes: 2
        run: |
          uv sync --locked --project tools/cyberlateral_dev --python "$pythonLocation/bin/python"
          uv venv --python "$pythonLocation/bin/python" "$CLOUD_HF_ENV"
          uv pip sync --python "$CLOUD_HF_ENV/bin/python" --require-hashes tools/cyberlateral_cloud/hf-requirements.lock
      - name: Verify cloud tooling without live HF access
        id: verify
        timeout-minutes: 5
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -B tools/cyberlateral_cloud/ci_verify.py \
            --hf-python "$CLOUD_HF_ENV/bin/python" \
            --output "$CLOUD_VERIFY_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cyberlateral-cloud-verification
          path: ${{ env.CLOUD_VERIFY_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
